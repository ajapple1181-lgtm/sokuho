<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>高校軟式野球 速報</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">高校軟式野球 LIVE</p>
      <h1>第74回岐阜県高校総体 軟式野球</h1>
      <p class="sub">準決勝 第1試合　恵那 vs 多治見北</p>
    </div>
    <div class="liveBadge">
      <span class="dot"></span>
      LIVE
    </div>
  </header>

  <main class="container">
    <section class="scoreCard">
      <div class="scoreMeta">
        <span id="gameStatus">読み込み中</span>
        <span id="updatedAt">--</span>
      </div>

      <div class="scoreBoard">
        <div class="teamRow">
          <div class="teamName">恵那</div>
          <div id="awayScore" class="totalScore">-</div>
        </div>
        <div class="teamRow">
          <div class="teamName">多治見北</div>
          <div id="homeScore" class="totalScore">-</div>
        </div>
      </div>
    </section>

    <section class="feedHeader">
      <h2>試合経過</h2>
      <p>GitHub Issueコメントを自動読み込みして表示しています。</p>
    </section>

    <section id="feed" class="feed"></section>

    <section id="empty" class="empty" hidden>
      まだ速報コメントがありません。
    </section>
  </main>

  <footer class="footer">
    非公式速報ページです。内容は入力されたコメントに基づきます。
  </footer>

  <script src="./app.js"></script>
</body>
</html>
